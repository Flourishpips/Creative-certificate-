<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Certificate</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Felipa&family=Great+Vibes&family=Italianno&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');
    </style>
</head>
<body class="bg-black">
    <div class="w-[800px] h-[600px] bg-[#f4f5f7] mx-auto mt-10 relative overflow-hidden">
        <div class="w-[50px] h-[50px] rounded-full absolute left-[-30px] top-[-30px] bg-[#ffd22f]"></div>
        <div class="w-[100px] h-[100px] rounded-full bg-[#ffd22f] absolute top-[-40px] left-[40px]"></div>
        <div class="w-[90px] h-[90px] rounded-full bg-[#d8b229] absolute top-[-40px] left-[45px]"></div>
        <div class="w-[170px] h-[170px] rounded-full bg-[#ffd22f] absolute top-[30px] left-[-40px]"></div>
        <div class="w-[150px] h-[150px] rounded-full bg-[#d8b229] absolute top-[26px] left-[-32px]"></div>
        <div class="w-[70px] h-[70px] rounded-full absolute left-[140px] top-[30px] bg-[#ffd22f]"></div>
        <div class="w-[700px] h-[550px] bg-[#f4f5f7] border-r-4 border-b-4 border-black "></div>
            <h1 class="cert text-6xl justify-self-center  text-black font-[Open+Sans] font-extrabold absolute top-[80px]">CERTIFICATE</h1>
            <p class="Participation justify-self-center text-black absolute top-[160px] text-xl font-semibold">of participation</p>
            <p class="proud absolute justify-self-center top-[200px] font-semibold text-black font-sans text-sm">WE ARE PROUDLY PRESENTING THIS TO</p>
            <p class="name absolute top-[240px] text-black text-6xl justify-self-center font-[Italianno] ">Kimberly Thompson</p>
            <p class="absolute justify-self-center top-[320px] text-center font-semibold font-[Tapestry] text-black">Course Title</p>
            <p class="description absolute top-[350px] text-black text-center  justify-self-center text-xs font-semibold">WE GIVE THIS CERTIFICATE BECAUSE KIMBERLY THOMPSON HAS <br>PARTICIPATED IN A SOCIAL EVENT THAT WE ORGANIZE.</p>
            <div class="absolute flex justify-self-center bottom-[180px]">
                <p class="text-sm ">DATE: __________________</p>
            </div>
            <div class="signature absolute gap-[180px] bottom-[80px] flex justify-self-center">
                <span class="president grid justify-center gap-[2px]">
                    <hr class="prt w-[150px] justify-self-center border-black">
                    <p class="text-xl justify-self-center font-semibold">Isabel Mercado</p>
                    <p class="text-sm justify-self-center">President</p>
                </span>
                <span class="president grid justify-center gap-[2px]">
                    <hr class="prt w-[150px] justify-self-center">
                    <p class="text-xl justify-self-center font-semibold">Kimberly Nguyen</p>
                    <p class="text-sm justify-self-center">Vice President</p>
                </span>
                </div>
                <div class="w-[30px] h-[30px] rounded-full absolute left-[25px] bottom-[150px] bg-[#ffd22f]"></div>
    
        <div class="w-[50px] h-[50px] rounded-full absolute right-[30px] top-[120px] bg-[#ffd22f]"></div>
        <div class="w-[103px] h-[53px] right-[0px] bottom-[0px] bg-[#ffd22f] absolute border-t-4 border-l-4 border-black"></div>
    </div>

</body>
</html>
